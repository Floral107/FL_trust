name: demo-ci

on:
  push:
    paths: ["demo/**", ".github/workflows/demo-ci.yml"]
  pull_request:
    paths: ["demo/**", ".github/workflows/demo-ci.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: demo }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: demo/requirements.txt
      - run: pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check .
      - name: Generate sample data
        run: python make_sample_data.py
      - name: Tests
        run: pytest tests/ -v
      - name: App imports cleanly
        run: python -c "import ast; ast.parse(open('app.py').read())"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t robshap-demo demo/
      - name: Smoke-run container
        run: |
          docker run -d -p 8501:8501 --name demo robshap-demo
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health > /dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"; docker logs demo; exit 1
